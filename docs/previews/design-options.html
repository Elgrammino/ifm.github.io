@font-face{font-family:IFM;src:url(fonts/m500.woff2);font-weight:400 500;font-display:swap}
@font-face{font-family:IFM;src:url(fonts/m800.woff2);font-weight:700 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#100e14;color:#f7f3fb;font:500 15px/1.5 system-ui,sans-serif}
.wrap{max-width:1280px;margin:auto;padding:32px 22px 38px}.intro{margin:0 auto 26px;max-width:1210px}
h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.045em;margin:0 0 6px;line-height:1.12}
.intro p{margin:0;color:#c4baca;max-width:68ch}
.board,.types{display:grid;grid-template-columns:repeat(3,minmax(0,390px));gap:20px;justify-content:center}
figure{margin:0;min-width:0}
.phone,.demo{--bg:#110b19;--surface:#241731;--text:#f7f2fb;--muted:#c5b6ce;--gold:#f7dcb1;--ink:#20100a;--signal:#d5ff72;--line:#54415c;--glow:#6a3190;--heading:Onest;--body:Onest;
background:var(--bg);color:var(--text);font:500 15px/1.45 var(--body),system-ui,sans-serif}
.phone.b{--bg:#19100d;--surface:#30201d;--muted:#d4bfb5;--line:#66483d;--glow:#6b3923}
.phone.c{--bg:#10091e;--surface:#2d1947;--muted:#d2bde4;--line:#675086;--glow:#7839bd}
.phone{overflow:hidden;border-radius:24px;outline:1px solid var(--line)}
.cover{height:154px;display:flex;align-items:flex-end;padding:14px 18px;background:linear-gradient(0deg,var(--bg),transparent 64%),url(../../assets/images/hero.jpg) center 42%/cover}
.cover span{color:var(--text);font-size:13px;font-weight:700;text-shadow:0 1px 6px #000}
.content{padding:0 16px 16px}.section{margin:6px 0 12px;font:750 32px/1.03 var(--heading),system-ui,sans-serif;letter-spacing:-.045em}
.event{padding:16px;border-radius:20px;outline:1px solid var(--line);background:radial-gradient(ellipse at top right,color-mix(in srgb,var(--glow) 32%,transparent),transparent 74%),var(--surface)}
.timing{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.live{color:var(--signal);font-weight:700;display:flex;align-items:center;gap:7px}.live::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.title{margin:13px 0;font:700 26px/1.06 var(--heading),system-ui,sans-serif;letter-spacing:-.028em;text-wrap:balance}
.person{display:flex;gap:10px;align-items:center;margin:0 0 14px;color:var(--text);font-weight:700}.person img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.action{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--gold);color:var(--ink);border-radius:12px;min-height:44px;padding:8px 14px;font-weight:750}
.next{margin-top:18px}.next h3{margin:0 0 4px;font-weight:750;font-size:17px}.next p{margin:0;color:var(--muted);font-size:14px}.next b{color:var(--text);margin-left:8px}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;border-top:1px solid var(--line);padding:8px 3px;min-height:50px;align-items:center;text-align:center;color:var(--muted);font-size:clamp(9px,2.6vw,11px);font-weight:650}
nav .active{color:var(--signal)}nav .central{border:1px solid var(--line);border-radius:8px;color:var(--gold);padding:5px 0}
figcaption{margin:12px 1px 8px;font-size:13px;color:#c4baca}
figcaption strong{display:block;color:#f7f3fb;font-size:16px;margin-bottom:3px}.spec{display:block;margin-top:4px;font-size:11px;color:#c4baca;overflow-wrap:anywhere}
.types-head{max-width:1210px;margin:25px auto 10px;font-size:20px}.demo{border:1px solid var(--line);border-radius:14px;padding:13px 16px}.demo strong{display:block;font:700 21px/1.14 var(--heading),system-ui,sans-serif}.demo small{display:block;margin-top:6px;color:var(--muted)}
.demo.ifm{--heading:IFM;--body:IFM}.demo.lit{--heading:Literata}
@media(max-width:1050px){.board,.types{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),390px))}}
@media(max-width:450px){.wrap{padding:22px 14px}.intro{margin-bottom:20px}}
</style>
<main class="wrap">
<header class="intro"><h1>МФИ 2027 · Цвет и шрифт</h1><p>Один экран «Сейчас», три варианта подсветки. Фото, порядок вкладок и текст одинаковые. Время и названия взяты из демонстрационной программы.</p></header>
<section class="board" aria-label="Три палитры"></section>
<h2 class="types-head">Шрифты на палитре А</h2>
<section class="types" aria-label="Три сочетания шрифтов"></section>
</main>
<script>
const variants=[
 ['a','А · Тёмная сцена','Ближе всего к текущему МФИ. Фиолетовый остаётся в глубине.'],
 ['b','Б · Тёплый свет','Золотая кнопка и тёплая поверхность. Фиолетовый и лайм видны в фото и статусе.'],
 ['c','В · Фиолетовый прожектор','Более заметный фиолетовый свет вокруг текущего события.']
];
const phone=() => `<div class="cover"><span>20 января · Главный зал</span></div>
 <div class="content"><h2 class="section">Сейчас</h2><article class="event">
 <div class="timing"><span class="live">Идёт сейчас</span><time>17:00–18:30</time></div>
 <h3 class="title">Мастер-класс: работа с картами</h3>
 <p class="person"><img src="../../assets/participants/asi.jpg" width="36" height="36" alt="">Asi Wind</p>
 <span class="action">Записать заметку</span></article>
 <section class="next"><h3>Дальше</h3><p><time>22:00</time><b>After-party</b></p></section></div>
 <nav aria-label="Разделы экрана"><span class="active">Сейчас</span><span>Спикеры</span><span class="central">Программа</span><span>Заметки</span><span>Новости</span></nav>`;
document.querySelector('.board').innerHTML=variants.map(([id,title,desc])=>`<figure><div class="phone ${id}">${phone()}</div><figcaption><strong>${title}</strong>${desc}<span class="spec"></span></figcaption></figure>`).join('');
document.querySelector('.types').innerHTML=[['ifm','1 · Шрифт МФИ','Текущая локальная гарнитура для всего экрана'],['onest','2 · Onest','Гротеск для заголовков и текста'],['lit','3 · Literata + Onest','Антиква для заголовка, Onest для текста']].map(([id,label,note])=>`<div class="demo ${id}"><b>${label}</b><strong>Мастер-класс: работа с картами</strong><small>17:00–18:30 · Asi Wind</small><small>${note}</small></div>`).join('');
const L=(hex)=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4).reduce((s,x,i)=>s+x*[.2126,.7152,.0722][i],0);
const ratio=(a,b)=>((Math.max(L(a),L(b))+.05)/(Math.min(L(a),L(b))+.05)).toFixed(1);
for(const el of document.querySelectorAll('.phone')){
 const s=getComputedStyle(el),g=n=>s.getPropertyValue('--'+n).trim();
 el.nextElementSibling.querySelector('.spec').textContent=
 `Фон ${g('bg')} · карточка ${g('surface')} · текст ${g('text')} · золото ${g('gold')} · лайм ${g('signal')}. Контраст: текст/фон ${ratio(g('text'),g('bg'))}:1, текст/карточка ${ratio(g('text'),g('surface'))}:1, кнопка ${ratio(g('ink'),g('gold'))}:1.`;
}
</script>
</html>
