nav button.on{color:#f7dcb1}nav b{position:absolute;top:2px;left:55%;width:9px;height:9px;border-radius:50%;background:var(--lime)}

.back{margin:0 calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left))}.toast{position:fixed;left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 10px);z-index:20;background:var(--gold);color:#1a0f07;font-weight:700;border-radius:14px;padding:12px 14px;animation:toast-in 200ms var(--ease-out) both}.toast.leaving{animation:toast-out 200ms var(--ease-out) both}

<script>
const REMOTE=IFM_REMOTE(window.IFM_FIREBASE);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function revealApp(){const splash=$('#splash');if(!splash||document.body.classList.contains('app-ready'))return;document.body.classList.remove('loading');document.body.classList.add('app-ready');splash.classList.add('done');splash.setAttribute('aria-hidden','true');setTimeout(()=>splash.remove(),350)}
const splashStarted=Date.now();
function finishLoading(){setTimeout(()=>{if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(revealApp));else revealApp()},Math.max(0,480-(Date.now()-splashStarted)))}
let backend;try{backend=localStorage}catch{backend={getItem(){return null},setItem(){throw Error('Storage unavailable')}}}

const T0=Date.parse('2027-01-19T00:00:00+03:00'),hm=t=>+t.slice(0,2)*60+ +t.slice(3);
const TY={lec:'Лекция',con:'Конкурс',show:'Шоу',party:'After-party 18+',dealer:'Дилерская зона',brk:'Перерыв'};
const NAV=[['home','home','Главная'],['prog','calendar','Программа'],['sp','people','Спикеры'],['notes','note','Заметки'],['news','bell','Новости']];
const ICON={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h3m-3 3h7"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m2-15a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5v1"/>',note:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8m-8 4h8"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',star:'<path d="m12 2 3.1 6.4 7.1 1-5.1 5 .9 7.1-6-3.3-6 3.3.9-7.1-5.1-5 7.1-1z"/>'};
const icon=(name,filled=false)=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"${filled?' style="fill:currentColor"':''}>${ICON[name]}</svg>`;
let D={events:[],speakers:[],links:[],dealers:[]},S=IFM.state(L('s')),fav=IFM.record(L('fav'),v=>typeof v==='boolean'),notes=IFM.record(L('notes'),v=>typeof v==='string'),tab='home',day=0,topic='',seen=Number(L('seen'))||0,adm=0,tp=0,tt,remoteOffline=false;
const tm=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});
const EV=()=>[...D.events,...S.add].map(e=>({...e,ts:T0+e.day*864e5+hm(e.t)*6e4+S.shift*6e4})).sort((a,b)=>a.ts-b.ts);

const speakerRole=s=>typeof s?.role==='string'?s.role.trim():'';
function av(s,c=''){const name=typeof s?.name==='string'?s.name.trim():'';const words=name.split(/\s+/).filter(Boolean),first=w=>Intl.Segmenter?[...new Intl.Segmenter('ru',{granularity:'grapheme'}).segment(w)][0]?.segment:[...w][0];const initials=words.length?[first(words[0]),...(words.length>1?[first(words.at(-1))]:[])].join(''):'?';const photo=typeof s?.photo==='string'&&/^[a-zA-Z0-9_./-]+$/.test(s.photo)&&!s.photo.includes('..')?s.photo:'';return `<span class="av ${photo?'':'ph'} ${c}" aria-hidden="true">${esc(initials)}${photo?`<img src="${esc(photo)}" width="64" height="64" alt="" onerror="this.remove()">`:''}</span>`}
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);navigator.vibrate&&navigator.vibrate(120);setTimeout(()=>{d.classList.add('leaving');setTimeout(()=>d.remove(),200)},3800)}
function card(e){const s=SP(e.sp),off=S.off[e.id];return `<div class="cd ev ${off?'off':''}"><button class="event-open" aria-label="${esc(e.title)}; ${tm(e.ts)}" onclick="openEv('${e.id}')"><span class="tm">${tm(e.ts)}<small>${e.d} мин</small></span><i class="dot ${e.type}" aria-hidden="true"></i><span class="b"><b>${esc(e.title)}</b><br><small>${off?'Отменено':TY[e.type]}${s&&!off?' · '+esc(s.name):''}</small></span></button><button class="st ${fav[e.id]?'on':''}" data-event-id="${e.id}" aria-label="${fav[e.id]?'Удалить из моего расписания':'Добавить в моё расписание'}: ${esc(e.title)}" aria-pressed="${!!fav[e.id]}" onclick="star('${e.id}')">${icon('star',fav[e.id])}</button></div>`}
const V={
 home(){const n=Date.now(),l=EV().filter(e=>!S.off[e.id]),cur=l.find(e=>e.ts<=n&&n<e.ts+e.d*6e4),nx=l.find(e=>e.ts>n),mine=l.filter(e=>fav[e.id]&&e.ts+e.d*6e4>n).slice(0,4),f=l[0],nw=S.news[0],featured=cur||nx;
 const dd=f&&n<f.ts?Math.ceil((f.ts-n)/864e5):0,day=t=>new Date(t).toLocaleDateString('ru',{day:'numeric',month:'long',timeZone:'Europe/Moscow'});
 return `<div class="hero"></div><div class="pad" style="margin-top:-46px"><h1 class="gold">Международный форум иллюзионистов</h1><p class="m" style="margin:6px 0 0">19–21 января 2027 · КЗ отеля «Санкт-Петербург»</p></div>
 <section class="ann" aria-label="Анонс события"><div class="ann-head"><span>${featured?cur?'Сейчас идёт':dd?`Старт программы · ${day(featured.ts)}`:'Дальше по программе':'Программа форума'}</span>${dd?`<span>Через ${dd} дн.</span>`:''}</div>${featured?`<h2>${esc(featured.title)}</h2><p class="ann-time">${day(featured.ts)} · ${tm(featured.ts)}–${tm(featured.ts+featured.d*6e4)}</p><div class="ann-controls"><button type="button" onclick="openEv('${featured.id}')">О событии</button><button type="button" data-event-id="${featured.id}" onclick="star('${featured.id}')" aria-pressed="${!!fav[featured.id]}">${fav[featured.id]?'Убрать из расписания':'В моё расписание'}</button></div>`:`<h2>${D.events.length||S.add.length?l.length?'Форум завершён':'Нет доступных событий':'Программа скоро появится'}</h2>`}</section>
 ${nw?`<div class="cd" role="button" tabindex="0" onclick="go('news')" onkeydown="keyAction(event,()=>go('news'))"><small>Новость</small><br><b>${esc(nw.t)}</b></div>`:''}
 <h2>Моё расписание</h2>${mine.length?mine.map(card).join(''):D.events.length||S.add.length?'<div class="cd m">Добавьте событие в программе, нажав значок сохранения рядом с ним.</div>':'<div class="cd m">Сохранённые события появятся здесь после публикации программы.</div>'}
 <h2>Дилерская зона</h2><div class="cd">${D.dealers.length?D.dealers.map(d=>`<a href="${esc(d.u)}" target="_blank" rel="noopener">${esc(d.n)}</a>`).join('<br>'):'<span class="m">Более 20 магазинов реквизита. Список и ссылки появятся здесь.</span>'}</div>
 <h2>Ссылки</h2><div class="cd">${D.links.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.n)}</a>`).join('<br>')}</div>
 <h2>Организаторы</h2><div class="cd row" role="button" tabindex="0" aria-label="Организаторы: вход по шести нажатиям" onclick="sec()" onkeydown="keyAction(event,sec)"><div class="av ph">UCM</div><div class="b"><b>United Club of Magicians</b><br><small>Организатор МФИ. Пироговская наб., 5/2, Санкт-Петербург</small></div></div>
 <p class="m pad" style="text-align:center">@IFM_RUSSIA · #IFM2027 · #МФИ2027<br>Бета-версия, расписание демонстрационное</p>`},
prog(){const l=EV(),tps=[...new Set([...D.events,...S.add].map(e=>e.topic).filter(Boolean))];
 return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Программа</h2><div class="tabs">${[0,1,2].map(i=>`<button class="chip ${day==i?'on':''}" aria-pressed="${day==i}" onclick="day=${i};render()">${19+i} янв</button>`).join('')}</div>

 ${l.filter(e=>e.day==day&&(!topic||e.topic==topic)).map(card).join('')||(l.length?'<div class="cd m">Для этого дня ничего не найдено.</div>':'<div class="cd m">Программа пока не опубликована. Загляните сюда позже.</div>')}`},
 sp(){const speakers=D.speakers.filter(s=>s&&/^[a-zA-Z0-9_-]+$/.test(s.id));return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Спикеры</h2>${speakers.map(s=>`<div class="cd row" role="button" tabindex="0" onclick="openSp('${s.id}')" onkeydown="keyAction(event,()=>openSp('${s.id}'))">${av(s)}<div class="b"><b dir="auto">${esc(speakerName(s))}</b>${speakerRole(s)?`<br><small>${esc(speakerRole(s))}</small>`:''}</div></div>`).join('')||'<div class="cd m">Информация о спикерах скоро появится.</div>'}`},
notes(){const l=EV().filter(e=>(notes[e.id]||'').trim());return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Заметки</h2>${l.map(e=>`<div class="cd" role="button" tabindex="0" onclick="openEv('${e.id}')" onkeydown="keyAction(event,()=>openEv('${e.id}'))"><b>${esc(e.title)}</b><br><small>${19+e.day} янв, ${tm(e.ts)}</small><p style="margin:8px 0 0;white-space:pre-wrap">${esc(notes[e.id].slice(0,160))}</p></div>`).join('')||'<div class="cd m">Откройте событие в программе и запишите заметку прямо в нём. Все заметки хранятся только на вашем телефоне.</div>'}${l.length?'<div class="pad"><button class="btn" onclick="exp()">Выгрузить все заметки</button></div>':''}`},
news(){seen=S.news[0]?.ts||0;L('seen',seen);return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Новости</h2>${S.news.map(n=>`<div class="cd"><b>${esc(n.t.trim()||'Обновление программы')}</b>${n.x.trim()?`<p style="margin:6px 0">${esc(n.x)}</p>`:''}<small>${new Date(n.ts).toLocaleString('ru',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'})}</small></div>`).join('')||'<div class="cd m">Новостей пока нет. Здесь организаторы сообщат об изменениях в программе.</div>'}`}};
function keyAction(event,action){if(event.target!==event.currentTarget)return;if(event.key==='Enter'||event.key===' '){event.preventDefault();action()}}
function topicAt(i){topic=[...new Set([...D.events,...S.add].map(e=>e.topic).filter(Boolean))][i]||'';render()}
function render(){const navFocused=!!document.activeElement?.closest?.('#nv');$('#v').innerHTML=V[tab]();$('#nv').innerHTML=NAV.map(([k,i,t])=>`<button class="${tab==k?'on':''}" aria-current="${tab==k?'page':'false'}" onclick="go('${k}')">${icon(i)}${t}${k=='news'&&S.news[0]?.ts>seen&&tab!='news'?'<b></b>':''}</button>`).join('');if(navFocused)$('#nv').querySelector?.('[aria-current="page"]')?.focus?.();if(adm)admPanel()}
function go(t){tab=t;closeSh();render();$('#app-scroll').scrollTop=0}
let focusBeforeSheet=null;
let sheetScrollY=0;
function lockSheet(){const scroller=$('#app-scroll');sheetScrollY=scroller.scrollTop;scroller.style.overflowY='hidden'}
function unlockSheet(){const scroller=$('#app-scroll');scroller.style.overflowY='';scroller.scrollTop=sheetScrollY}
function sh(h){const e=$('#sh');if(e.style.display!=='block'){focusBeforeSheet=document.activeElement;lockSheet()}e.innerHTML='<button class="btn g back" onclick="closeSh()">‹ Назад</button>'+h;e.style.display='block';e.scrollTop=0;e.querySelector?.('button')?.focus?.();if(location.hash!=='#detail')history.pushState({sheet:true},'','#detail')}
function restoreFocus(){if(focusBeforeSheet?.isConnected)focusBeforeSheet.focus();focusBeforeSheet=null}
function closeSh(){const open=$('#sh').style.display==='block';$('#sh').style.display='none';adm=0;if(open){unlockSheet();if(location.hash==='#detail')history.back()}restoreFocus()}
window.addEventListener('popstate',()=>{const open=$('#sh').style.display==='block';$('#sh').style.display='none';adm=0;if(open)unlockSheet();restoreFocus()})
document.addEventListener('keydown',event=>{const sheet=$('#sh');if(sheet.style.display!=='block')return;if(event.key==='Escape'){event.preventDefault();closeSh();return}if(event.key!=='Tab')return;const els=[...sheet.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(el=>!el.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}})
function star(id){fav[id]=!fav[id];L('fav',fav);render();document.querySelector(`[data-event-id="${id}"]`)?.focus?.()}
function openEv(id){const e=EV().find(x=>x.id==id);if(!e)return toast('Событие не найдено');const s=SP(e.sp);sh(`<div class="pad"><small>${19+e.day} января · ${tm(e.ts)}–${tm(e.ts+e.d*6e4)} · ${TY[e.type]}</small><h1 style="margin:6px 0 10px">${esc(e.title)}</h1>${S.off[id]?'<p class="m"><b>Событие отменено</b></p>':''}<p>${esc(e.desc||'Описание появится позже.')}</p>
 ${s?`<div class="cd row" role="button" tabindex="0" style="margin:12px 0;width:100%" onclick="openSp('${s.id}')" onkeydown="keyAction(event,()=>openSp('${s.id}'))">${av(s)}<div class="b"><b dir="auto">${esc(speakerName(s))}</b>${speakerRole(s)?`<br><small>${esc(speakerRole(s))}</small>`:''}</div></div>`:''}${prods(s)}
 <button class="btn g" onclick="star('${id}');openEv('${id}')" style="margin:8px 0">${fav[id]?'Удалить из моего расписания':'Добавить в моё расписание'}</button>
 <label for="event-note">Заметки</label><textarea id="event-note" placeholder="Пишите прямо здесь" oninput="notes['${id}']=this.value;L('notes',notes)">${esc(notes[id]||'')}</textarea></div>`)}
function prods(s){return Array.isArray(s?.products)&&s.products.length?`<h2 style="margin:16px 0 6px">Реквизит спикера</h2>`+s.products.filter(p=>p&&typeof p==='object').map(p=>{const shops=Array.isArray(p.shops)?p.shops.filter(h=>h&&typeof h.n==='string'&&/^https:\/\//.test(h.u)):[];return `<div class="cd" style="margin:8px 0"><b>${esc(p.n||'Реквизит')}</b>${p.d?`<p class="m" style="margin:4px 0">${esc(p.d)}</p>`:''}${shops.length?'Где купить: '+shops.map(h=>`<a href="${esc(h.u)}" target="_blank" rel="noopener">${esc(h.n)}</a>`).join(' · '):'<span class="m">Ссылка появится позже.</span>'}</div>`}).join(''):''}
function openSp(id){const s=SP(id);if(!s)return toast('Спикер не найден');const ls=EV().filter(e=>e.sp==id);sh(`<div class="pad" style="text-align:center">${av(s,'big')}<h1 dir="auto">${esc(speakerName(s))}</h1>${speakerRole(s)?`<p class="m">${esc(speakerRole(s))}</p>`:''}</div><div class="pad">${s.bio?`<p>${esc(s.bio)}</p>`:''}${prods(s)}<h2 style="margin:16px 0 0">Выступления</h2></div>${ls.map(card).join('')||'<div class="cd m">Выступления спикера пока не добавлены.</div>'}`)}
function exp(){const x=EV().filter(e=>(notes[e.id]||'').trim()).map(e=>`${19+e.day} января, ${tm(e.ts)} — ${e.title}\n${notes[e.id]}`).join('\n\n———\n\n');const f=new File([x],'IFM2027-заметки.txt',{type:'text/plain'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}}
/* ===== скрытая админка: 6 касаний по фото организаторов ===== */
function sec(){clearTimeout(tt);if(++tp>=6){tp=0;if(!REMOTE.ready)return toast('Общие правки пока не подключены');sh('<div class="pad"><h1>Вход организатора</h1><form onsubmit="event.preventDefault();signIn()"><label for="email">Электронная почта</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Войти</button></form></div>')}tt=setTimeout(()=>tp=0,2500)}
async function signIn(){try{await REMOTE.login($('#email').value,$('#password').value);await sync();adm=1;admPanel()}catch(e){REMOTE.logout();toast('Не удалось войти. Проверьте учётную запись и соединение.')}}
function admPanel(){$('#sh').innerHTML='<button class="btn g back" onclick="closeSh()">‹ Назад</button>'+`<div class="pad"><h1 class="gold">Администратор</h1><p class="m">${REMOTE.ready?"Обновления видны всем посетителям.":"Общие правки пока не подключены."} Сдвиг сейчас: ${S.shift} мин</p>
 <h2 style="margin:16px 0 4px">Сдвинуть всё расписание</h2><label for="n">Минуты сдвига</label><input id="n" type="number" min="1" max="720" value="10" inputmode="numeric"><div class="row"><button class="btn b" onclick="shift(1)">Позже на N мин</button><button class="btn g b" onclick="shift(-1)">Раньше на N мин</button></div>
 <h2 style="margin:20px 0 4px">Новость</h2><label for="nt">Заголовок</label><input id="nt"><label for="nx">Текст новости</label><textarea id="nx" style="min-height:80px"></textarea><button class="btn" onclick="pub()">Опубликовать</button>
 <h2 style="margin:20px 0 4px">Добавить событие</h2><label for="at">Название</label><input id="at"><div class="row"><div class="b"><label for="ad">День</label><select id="ad"><option value="0">19 янв</option><option value="1">20 янв</option><option value="2">21 янв</option></select></div><div class="b"><label for="ah">Время</label><input id="ah" type="time" value="12:00"></div><div class="b"><label for="am">Минуты</label><input id="am" type="number" min="1" max="1440" value="30"></div></div><label for="ay">Тип события</label><select id="ay">${Object.entries(TY).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn" onclick="addE()">Добавить</button>
 <h2 style="margin:20px 0 4px">Отмена событий</h2>${EV().map(e=>`<div class="row pr"><div class="b"><b>${esc(e.title)}</b><br><small>${19+e.day} янв, ${tm(e.ts)}</small></div><button class="btn g" onclick="save(null,s=>{s.off['${e.id}']=!s.off['${e.id}']})">${S.off[e.id]?'Вернуть':'Отменить'}</button></div>`).join('')}
 <button class="btn g" style="margin:20px 0" onclick="if(confirm('Сбросить все изменения?')){save(null,()=>({shift:0,off:{},add:[],news:[]}))}">Сбросить всё</button><button class="btn g" onclick="REMOTE.logout();closeSh()">Выйти</button></div>`}
function shift(k){const n=+$('#n').value;if(!Number.isInteger(n)||n<1||n>720||Math.abs(S.shift+k*n)>1440)return toast('Введите от 1 до 720 минут. Общий сдвиг — не больше суток.');save('Расписание сдвинуто',s=>{if(Math.abs(s.shift+k*n)>1440)throw Error('Слишком большой сдвиг');s.shift+=k*n;s.news.unshift({t:'Расписание изменено',x:'Все события ' + (k>0?'сдвинуты на '+n+' минут позже':'начинаются на '+n+' минут раньше') + '.',ts:Date.now()})})}
function pub(){const t=$('#nt').value.trim(),x=$('#nx').value;if(!t)return toast('Введите заголовок');save('Новость опубликована',s=>{s.news.unshift({t,x,ts:Date.now()})})}
function addE(){const t=$('#at').value.trim();if(!t)return toast('Введите название');const e={id:'x'+Date.now()+'_'+Math.random().toString(36).slice(2,7),day:+$('#ad').value,t:$('#ah').value,d:+$('#am').value,type:$('#ay').value,title:t};if(!IFM.validEvent(e))return toast('Проверьте время и длительность: от 1 до 1440 минут.');save('Событие добавлено',s=>{s.add.push(e)})}
let saving=false;
async function save(message,change){if(!REMOTE.ready||!REMOTE.signedIn())return toast('Войдите как организатор');if(saving)return; saving=true;try{const next=await REMOTE.update(raw=>{const state=IFM.state(raw);return IFM.state(change(state)||state)});S=IFM.state(next);L('s',S);if(message)toast(message);render()}catch(e){if(!REMOTE.signedIn())REMOTE.logout();toast('Не удалось опубликовать. Изменения не сохранены, попробуйте снова.')}finally{saving=false}}
async function sync(){if(!REMOTE.ready)return;try{const raw=await REMOTE.read(),next=IFM.state(raw);const latest=S.news[0]?.ts;S=next;L('s',S);if(remoteOffline){remoteOffline=false;toast('Связь восстановлена. Программа обновлена.')}if(S.news[0]&&S.news[0].ts!==latest&&latest&&tab!=='news'&&!adm)toast('Новость: '+S.news[0].t);if(!adm)render()}catch(e){if(!remoteOffline){remoteOffline=true;toast('Нет связи с общей программой. Показаны последние сохранённые данные.')}}}
const loadDeadline=setTimeout(()=>{if(!document.body.classList.contains('loading'))return;$('#v').innerHTML='<div class=cd><h1>Программа загружается слишком долго</h1><p>Проверьте соединение или попробуйте ещё раз.</p><button class=btn onclick=location.reload()>Повторить</button></div>';finishLoading()},10000);
function program(raw){if(!raw||!Array.isArray(raw.events)||!raw.events.every(IFM.validEvent)||!Array.isArray(raw.speakers)||!Array.isArray(raw.links)||!Array.isArray(raw.dealers))return null;const links=a=>a.filter(x=>x&&typeof x.n==='string'&&typeof x.u==='string'&&/^https:\/\//.test(x.u));return {...raw,speakers:raw.speakers.filter(s=>s&&typeof s.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(s.id)),links:links(raw.links),dealers:links(raw.dealers)}}
(async()=>{try{const response=await fetch('data.json');if(!response.ok)throw Error('HTTP '+response.status);const data=program(await response.json());if(!data)throw Error('Invalid data');D=data;L('d',D)}catch(e){const cached=program(L('d'));if(cached){D=cached;toast('Открыта сохранённая программа. Обновление пока недоступно.')}else{clearTimeout(loadDeadline);$('#v').innerHTML='<div class=cd><h1>Программа не загрузилась</h1><p>Проверьте соединение и попробуйте ещё раз.</p><button class=btn onclick=location.reload()>Повторить</button></div>';finishLoading();return}}clearTimeout(loadDeadline);render();finishLoading();sync();setInterval(sync,20000);document.addEventListener('visibilitychange',()=>!document.hidden&&sync())})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>toast('Офлайн-режим недоступен. Приложение продолжит работать с интернетом.'));
</script></body></html>
