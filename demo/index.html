<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IFM 2027</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#07050c">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="IFM 2027">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:M;src:url(m500.woff2);font-weight:500;font-display:swap}
@font-face{font-family:M;src:url(m700.woff2);font-weight:700;font-display:swap}
@font-face{font-family:M;src:url(m800.woff2);font-weight:800;font-display:swap}
:root{--bg:#07050c;--ln:#ffffff1f;--m:#a79fb8;--lime:#c6ff3d;--vio:#a35cff;--gold:linear-gradient(135deg,#f7dcb1,#c7a061 55%,#b87115)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#fff;font:500 16px/1.4 M,system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
html{overscroll-behavior-y:contain}button,.ev,.cd[onclick]{touch-action:manipulation}button{user-select:none;-webkit-user-select:none}button:active,.ev:active,.cd[onclick]:active{filter:brightness(1.16)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 38% at 0 0,#3f1b61aa,transparent),radial-gradient(55% 34% at 100% 38%,#1e402caa,transparent),radial-gradient(70% 40% at 50% 100%,#3f1b6188,transparent)}
button,input,textarea,select{font:inherit;color:inherit}
.hero{height:300px;background:linear-gradient(transparent 55%,var(--bg)),url(hero.jpg) center/cover;margin-top:0}
.pad{padding:0 16px}h1,h2{margin:0;font-weight:800;letter-spacing:.01em}h1{font-size:26px;line-height:1.1}h2{font-size:20px;margin:22px 16px 10px}
.gold{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
small,.m{color:var(--m);font-size:14px}
.cd{background:#ffffff0c;border:1px solid var(--ln);border-radius:20px;padding:14px;margin:10px 16px;backdrop-filter:blur(8px)}
.cd.hi{border-color:#c6ff3d66;box-shadow:0 0 28px #a35cff33}
.row{display:flex;gap:12px;align-items:center}.b{flex:1;min-width:0;overflow-wrap:anywhere}
.tabs{display:flex;gap:8px;overflow:auto;padding:4px 16px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:#ffffff0a;border-radius:99px;padding:8px 15px;font-weight:700}
.chip.on{background:var(--gold);color:#1a0f07;border-color:transparent}
.ev{display:flex;gap:12px;align-items:center;padding:13px 14px}.ev.off{opacity:.45}.ev.off b{text-decoration:line-through}
.tm{flex:none;width:52px;font-weight:800;font-size:18px;line-height:1.1}.tm small{display:block;font-weight:500;font-size:12px}
.dot{flex:none;width:10px;height:44px;border-radius:5px;background:var(--vio)}
.con{background:var(--lime)}.show{background:#f7dcb1}.party{background:#ff5fa8}.dealer{background:#5fd4ff}.brk{background:#555}
.st{flex:none;background:none;border:0;font-size:26px;color:#ffffff44;padding:4px}.st.on{color:#f7dcb1;text-shadow:0 0 14px #c7a061}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none}
.ph{display:grid;place-items:center;font-weight:800;font-size:20px;background:radial-gradient(#000 58%,transparent 59%),conic-gradient(var(--lime),#e8ff6b,var(--vio),#d6a3ff,var(--lime));color:#f7dcb1}
.big{width:112px;height:112px;margin:0 auto 10px;display:block}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--gold);color:#1a0f07;font-weight:800}.btn.g{background:#ffffff14;color:#fff;border:1px solid var(--ln)}
input,textarea,select{width:100%;background:#00000066;border:1px solid var(--ln);border-radius:12px;padding:12px;margin:5px 0}textarea{min-height:140px;resize:vertical}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b0813ee;backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{min-width:0;flex:1;background:none;border:0;color:var(--m);font-size:12px;font-weight:700;padding:6px 1px;position:relative}nav button i{display:block;font-style:normal;font-size:22px;margin-bottom:1px}
nav button.on{color:#f7dcb1}nav b{position:absolute;top:2px;left:55%;width:9px;height:9px;border-radius:50%;background:var(--lime)}
#sh{position:fixed;inset:0;min-height:100dvh;z-index:9;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 0 60px;display:none}
#sh:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 38% at 0 0,#3f1b61aa,transparent),radial-gradient(55% 34% at 100% 60%,#1e402caa,transparent)}
.back{margin:0 16px 10px}.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;background:var(--gold);color:#1a0f07;font-weight:700;border-radius:14px;padding:12px 14px}
.demo-notice{padding:10px 16px;background:#20152f;color:#e0d7ef;font-size:14px;text-align:center}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.ev{min-width:0}.ev .b{overflow-wrap:anywhere}.cd{overflow-wrap:anywhere}#sh .row{flex-wrap:wrap}#sh .row input,#sh .row select{flex:1 1 90px;min-width:0}#sh .row .btn{min-width:120px}a{overflow-wrap:anywhere}.pr{border-top:1px solid var(--ln);padding-top:10px;margin-top:10px}a{color:#f7dcb1}
@media(min-width:700px){body{max-width:560px;margin:0 auto}nav{max-width:560px;margin:0 auto}}
</style></head><body><div class="demo-notice">Демонстрационная версия · программа предварительная</div><div id="v"></div><div id="sh"></div>
<nav id="nv" aria-label="Основная навигация"></nav>
<script src="storage.js"></script>
<script>
const DB='',PIN='1234'; /* DB: адрес Firebase Realtime Database, пусто = демо только на этом телефоне */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let backend;try{backend=localStorage}catch{backend={getItem(){return null},setItem(){throw Error('Storage unavailable')}}}
const L=IFM.storage(backend,location.pathname.replace(/index\.html$/,''),()=>toast('Не удалось сохранить данные. До закрытия вкладки они останутся в памяти.'));
const T0=Date.parse('2027-01-19T00:00:00+03:00'),hm=t=>+t.slice(0,2)*60+ +t.slice(3);
const TY={lec:'Лекция',con:'Конкурс',show:'Шоу',party:'After-party 18+',dealer:'Дилерская зона',brk:'Перерыв'};
const NAV=[['home','◈','Главная'],['prog','▤','Программа'],['sp','☺','Спикеры'],['notes','✎','Заметки'],['news','✦','Новости']];
let D={events:[],speakers:[],links:[],dealers:[]},S=IFM.state(L('s')),fav=IFM.record(L('fav'),v=>typeof v==='boolean'),notes=IFM.record(L('notes'),v=>typeof v==='string'),tab='home',day=0,topic='',seen=Number(L('seen'))||0,adm=0,tp=0,tt;
const tm=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});
const EV=()=>[...D.events,...S.add].map(e=>({...e,ts:T0+e.day*864e5+hm(e.t)*6e4+S.shift*6e4})).sort((a,b)=>a.ts-b.ts);
const SP=id=>D.speakers.find(s=>s.id===id),av=(s,c='')=>s.photo?`<img class="av ${c}" src="${s.photo}" alt="">`:`<div class="av ph ${c}">${esc(s.name.split(' ').map(w=>w[0]).join('').slice(0,2))}</div>`;
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);navigator.vibrate&&navigator.vibrate(120);setTimeout(()=>d.remove(),4000)}
function card(e){const s=SP(e.sp),off=S.off[e.id];return `<div class="cd ev ${off?'off':''}" role="button" tabindex="0" aria-label="${esc(e.title)}; ${tm(e.ts)}" onclick="openEv('${e.id}')" onkeydown="cardKey(event,'${e.id}')"><div class="tm">${tm(e.ts)}<small>${e.d} мин</small></div><i class="dot ${e.type}"></i><div class="b"><b>${esc(e.title)}</b><br><small>${off?'Отменено':TY[e.type]}${s&&!off?' · '+esc(s.name):''}</small></div><button class="st ${fav[e.id]?'on':''}" aria-label="${fav[e.id]?'Удалить из моего расписания':'Добавить в моё расписание'}: ${esc(e.title)}" aria-pressed="${!!fav[e.id]}" onclick="event.stopPropagation();star('${e.id}')">★</button></div>`}
const V={
home(){const n=Date.now(),l=EV().filter(e=>!S.off[e.id]),cur=l.find(e=>e.ts<=n&&n<e.ts+e.d*6e4),nx=l.find(e=>e.ts>n),mine=l.filter(e=>fav[e.id]&&e.ts+e.d*6e4>n).slice(0,4),f=l[0],nw=S.news[0];
 const dd=f&&n<f.ts?Math.ceil((f.ts-n)/864e5):0;
 return `<div class="hero"></div><div class="pad" style="margin-top:-46px"><h1 class="gold">Международный форум иллюзионистов</h1><p class="m" style="margin:6px 0 0">19–21 января 2027 · КЗ отеля «Санкт-Петербург»</p></div>
 <div class="cd hi">${dd?`<small>До начала форума</small><h2 style="margin:2px 0 0">${dd} дн.</h2>`:cur?`<small>Сейчас идёт</small><h2 style="margin:2px 0 8px">${esc(cur.title)}</h2>${nx?`<small>Дальше в ${tm(nx.ts)}: ${esc(nx.title)}</small>`:''}`:nx?`<small>Следующее в ${tm(nx.ts)}</small><h2 style="margin:2px 0 0">${esc(nx.title)}</h2>`:'<h2 style="margin:0">Форум завершён</h2>'}</div>
 ${nw?`<div class="cd" onclick="go('news')"><small>Новость</small><br><b>${esc(nw.t)}</b></div>`:''}
 <h2>Моё расписание</h2>${mine.length?mine.map(card).join(''):'<div class="cd m">Нажмите ★ у события в программе, и оно появится здесь.</div>'}
 <h2>Дилерская зона</h2><div class="cd">${D.dealers.length?D.dealers.map(d=>`<a href="${esc(d.u)}" target="_blank" rel="noopener">${esc(d.n)}</a>`).join('<br>'):'<span class="m">Более 20 магазинов реквизита. Список и ссылки появятся здесь.</span>'}</div>
 <h2>Ссылки</h2><div class="cd">${D.links.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.n)}</a>`).join('<br>')}</div>
 <h2>Организаторы</h2><div class="cd row" onclick="sec()"><div class="av ph">UCM</div><div class="b"><b>United Club of Magicians</b><br><small>Организатор МФИ. Пироговская наб., 5/2, Санкт-Петербург</small></div></div>
 <p class="m pad" style="text-align:center">@IFM_RUSSIA · #IFM2027 · #МФИ2027<br>Бета-версия, расписание демонстрационное</p>`},
prog(){const l=EV(),tps=[...new Set([...D.events,...S.add].map(e=>e.topic).filter(Boolean))];
 return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Программа</h2><div class="tabs">${[0,1,2].map(i=>`<button class="chip ${day==i?'on':''}" onclick="day=${i};render()">${19+i} янв</button>`).join('')}</div>
 <div class="tabs"><button class="chip ${!topic?'on':''}" onclick="topic='';render()">Все темы</button>${tps.map((t,i)=>`<button class="chip ${topic==t?'on':''}" onclick="topicAt(${i})">${esc(t)}</button>`).join('')}</div>
 ${l.filter(e=>e.day==day&&(!topic||e.topic==topic)).map(card).join('')||'<div class="cd m">Для этого дня ничего не найдено.</div>'}`},
sp(){return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Спикеры</h2>${D.speakers.map(s=>`<div class="cd row" onclick="openSp('${s.id}')">${av(s)}<div class="b"><b>${esc(s.name)}</b><br><small>${esc(s.role)}</small></div></div>`).join('')}`},
notes(){const l=EV().filter(e=>(notes[e.id]||'').trim());return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Заметки</h2>${l.map(e=>`<div class="cd" onclick="openEv('${e.id}')"><b>${esc(e.title)}</b><br><small>${19+e.day} янв, ${tm(e.ts)}</small><p style="margin:8px 0 0;white-space:pre-wrap">${esc(notes[e.id].slice(0,160))}</p></div>`).join('')||'<div class="cd m">Откройте событие в программе и запишите заметку прямо в нём. Все заметки хранятся только на вашем телефоне.</div>'}${l.length?'<div class="pad"><button class="btn" onclick="exp()">Выгрузить все заметки</button></div>':''}`},
news(){seen=S.news.length;L('seen',seen);return `<div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h2 style="margin-top:6px">Новости</h2>${S.news.map(n=>`<div class="cd"><b>${esc(n.t)}</b><p style="margin:6px 0">${esc(n.x)}</p><small>${new Date(n.ts).toLocaleString('ru',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'})}</small></div>`).join('')||'<div class="cd m">Новостей пока нет. Здесь организаторы сообщат об изменениях в программе.</div>'}`}};
function cardKey(event,id){if(event.target!==event.currentTarget)return;if(event.key==='Enter'||event.key===' '){event.preventDefault();openEv(id)}}
function topicAt(i){topic=[...new Set([...D.events,...S.add].map(e=>e.topic).filter(Boolean))][i]||'';render()}
function render(){$('#v').innerHTML=V[tab]();$('#nv').innerHTML=NAV.map(([k,i,t])=>`<button class="${tab==k?'on':''}" aria-current="${tab==k?'page':'false'}" onclick="go('${k}')"><i>${i}</i>${t}${k=='news'&&S.news.length>seen&&tab!='news'?'<b></b>':''}</button>`).join('');if(adm)admPanel()}
function go(t){tab=t;closeSh();render();scrollTo(0,0)}
function sh(h){const e=$('#sh');e.innerHTML='<button class="btn g back" onclick="closeSh()">‹ Назад</button>'+h;e.style.display='block';e.scrollTop=0;if(location.hash!=='#detail')history.pushState({sheet:true},'','#detail')}
function closeSh(){const open=$('#sh').style.display==='block';$('#sh').style.display='none';adm=0;if(open&&location.hash==='#detail')history.back()}
window.addEventListener('popstate',()=>{$('#sh').style.display='none';adm=0})
function star(id){fav[id]=!fav[id];L('fav',fav);render()}
function openEv(id){const e=EV().find(x=>x.id==id);if(!e)return toast('Событие не найдено');const s=SP(e.sp);sh(`<div class="pad"><small>${19+e.day} января · ${tm(e.ts)}–${tm(e.ts+e.d*6e4)} · ${TY[e.type]}</small><h1 style="margin:6px 0 10px">${esc(e.title)}</h1>${S.off[id]?'<p class="m"><b>Событие отменено</b></p>':''}<p>${esc(e.desc||'Описание появится позже.')}</p>
 ${s?`<div class="cd row" style="margin:12px 0" onclick="openSp('${s.id}')">${av(s)}<div class="b"><b>${esc(s.name)}</b><br><small>${esc(s.role)}</small></div></div>`:''}${prods(s)}
 <button class="btn g" onclick="star('${id}');openEv('${id}')" style="margin:8px 0">${fav[id]?'★ В моём расписании':'☆ Добавить в моё расписание'}</button>
 <h2 style="margin:16px 0 6px">Заметки</h2><textarea placeholder="Пишите прямо здесь" oninput="notes['${id}']=this.value;L('notes',notes)">${esc(notes[id]||'')}</textarea></div>`)}
function prods(s){return s&&s.products&&s.products.length?`<h2 style="margin:16px 0 6px">Реквизит спикера</h2>`+s.products.map(p=>`<div class="cd" style="margin:8px 0"><b>${esc(p.n)}</b><p class="m" style="margin:4px 0">${esc(p.d||'')}</p>Где купить: ${p.shops.map(h=>`<a href="${esc(h.u)}" target="_blank" rel="noopener">${esc(h.n)}</a>`).join(' · ')}</div>`).join(''):''}
function openSp(id){const s=SP(id);if(!s)return toast('Спикер не найден');const ls=EV().filter(e=>e.sp==id);sh(`<div class="pad" style="text-align:center">${av(s,'big')}<h1>${esc(s.name)}</h1><p class="m">${esc(s.role)}</p></div><div class="pad"><p>${esc(s.bio)}</p>${prods(s)}<h2 style="margin:16px 0 0">Выступления</h2></div>${ls.map(card).join('')}`)}
function exp(){const x=EV().filter(e=>(notes[e.id]||'').trim()).map(e=>`${19+e.day} января, ${tm(e.ts)} — ${e.title}\n${notes[e.id]}`).join('\n\n———\n\n');const f=new File([x],'IFM2027-заметки.txt',{type:'text/plain'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}}
/* ===== скрытая админка: 6 касаний по фото организаторов ===== */
function sec(){clearTimeout(tt);if(++tp>=6){tp=0;sh('<div class="pad"><h1>Вход для администратора</h1><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" onclick="if($(\'#pin\').value==PIN){adm=1;admPanel()}else toast(\'Неверный PIN\')">Войти</button></div>')}tt=setTimeout(()=>tp=0,2500)}
function admPanel(){$('#sh').innerHTML='<button class="btn g back" onclick="closeSh()">‹ Назад</button>'+`<div class="pad"><h1 class="gold">Администратор</h1><p class="m">${DB?'Изменения сразу уходят всем.':'Демо-режим: изменения только на этом телефоне.'} Сдвиг сейчас: ${S.shift} мин</p>
 <h2 style="margin:16px 0 4px">Сдвинуть всё расписание</h2><input id="n" type="number" value="10" inputmode="numeric"><div class="row"><button class="btn b" onclick="shift(1)">Позже на N мин</button><button class="btn g b" onclick="shift(-1)">Раньше на N мин</button></div>
 <h2 style="margin:20px 0 4px">Новость</h2><input id="nt" placeholder="Заголовок"><textarea id="nx" style="min-height:80px" placeholder="Текст"></textarea><button class="btn" onclick="pub()">Опубликовать</button>
 <h2 style="margin:20px 0 4px">Добавить событие</h2><input id="at" placeholder="Название"><div class="row"><select id="ad"><option value="0">19 янв</option><option value="1">20 янв</option><option value="2">21 янв</option></select><input id="ah" type="time" value="12:00"><input id="am" type="number" value="30"></div><select id="ay">${Object.entries(TY).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn" onclick="addE()">Добавить</button>
 <h2 style="margin:20px 0 4px">Отмена событий</h2>${EV().map(e=>`<div class="row pr"><div class="b"><b>${esc(e.title)}</b><br><small>${19+e.day} янв, ${tm(e.ts)}</small></div><button class="btn g" onclick="S.off['${e.id}']=!S.off['${e.id}'];save()">${S.off[e.id]?'Вернуть':'Отменить'}</button></div>`).join('')}
 <button class="btn g" style="margin:20px 0" onclick="if(confirm('Сбросить все изменения?')){S={shift:0,off:{},add:[],news:[]};save()}">Сбросить всё</button></div>`}
function shift(k){const n=+$('#n').value;if(!Number.isInteger(n)||n<1||n>720||Math.abs(S.shift+k*n)>1440)return toast('Введите от 1 до 720 минут. Общий сдвиг — не больше суток.');S.shift+=k*n;S.news.unshift({t:'Расписание изменилось',x:`Все события ${k>0?'сдвинуты на '+n+' мин позже':'начнутся на '+n+' мин раньше'}.`,ts:Date.now()});save('Расписание сдвинуто')}
function pub(){const t=$('#nt').value.trim();if(!t)return toast('Введите заголовок');S.news.unshift({t,x:$('#nx').value,ts:Date.now()});save('Новость опубликована')}
function addE(){const t=$('#at').value.trim();if(!t)return toast('Введите название');const e={id:'x'+Date.now(),day:+$('#ad').value,t:$('#ah').value,d:+$('#am').value,type:$('#ay').value,title:t};if(!IFM.validEvent(e))return toast('Проверьте время и длительность: от 1 до 1440 минут.');S.add.push(e);save('Событие добавлено')}
async function save(m){L('s',S);if(DB)try{await fetch(DB+'/s.json',{method:'PUT',body:JSON.stringify(JSON.stringify(S))})}catch(e){toast('Нет сети: сохранено только на этом телефоне')}m&&toast(m);render()}
async function sync(){if(!DB)return;try{const j=await(await fetch(DB+'/s.json?'+Date.now())).json();if(j){const o=S.news.length;S=JSON.parse(j);L('s',S);if(S.news.length>o&&o>=0&&tab!='news'&&!adm)toast('Новость: '+S.news[0].t);if(!adm)render()}}catch(e){}}
