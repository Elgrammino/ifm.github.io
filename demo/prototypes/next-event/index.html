<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07050c">
<title>IFM 2027 — три варианта главного блока</title>
<style>
@font-face{font-family:M;src:url(../../m500.woff2);font-weight:500;font-display:swap}
@font-face{font-family:M;src:url(../../m700.woff2);font-weight:700;font-display:swap}
@font-face{font-family:M;src:url(../../m800.woff2);font-weight:800;font-display:swap}
:root{--bg:#07050c;--surface:#ffffff0c;--line:#ffffff1f;--muted:#a79fb8;--gold:#f7dcb1;--lime:#c6ff3d}
*{box-sizing:border-box}body{margin:0;padding:0 0 100px;background:var(--bg);color:white;font:500 16px/1.4 M,system-ui,sans-serif}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.shell{max-width:560px;margin:0 auto}.notice{padding:10px 16px;background:#20152f;color:#e0d7ef;text-align:center;font-size:14px}
.hero{height:255px;background:linear-gradient(transparent 55%,var(--bg)),url(../../hero.jpg) center/cover}
.intro{position:relative;margin:-43px 16px 22px}.intro h1{color:var(--gold);font-size:26px;line-height:1.1;margin:0}.intro p{margin:8px 0 0;color:var(--muted);font-size:14px}
.section-title{font-size:20px;margin:24px 16px 10px}.saved{margin:0 16px 24px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px}.saved p{margin:0;color:var(--muted);font-size:14px}.saved ul{margin:0;padding-left:20px}.back-link{display:inline-block;margin:8px 16px;color:var(--gold);text-underline-offset:3px}
.stage{min-height:198px}.stage button{min-height:44px}.stage button:active{filter:brightness(1.15)}
.detail{max-width:min(90vw,430px);width:100%;border:1px solid #74677c;border-radius:20px;padding:24px;background:#191322;color:white}.detail::backdrop{background:#000b}.detail h2{font-size:22px;margin:6px 0}.detail p{color:#ddd1e5}.detail small{color:var(--gold)}.detail button{min-height:44px;padding:10px 16px;margin:4px 6px 0 0;border:1px solid #6b5e73;border-radius:12px;background:#292136;color:#fff}
@media(max-width:360px){.intro h1{font-size:23px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}}

.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {
  bottom: auto;
  top: 24px;
}
</style>
</head>
<body>
<div class="shell">
  <div class="notice">Эскиз главного блока · программа предварительная</div>
  <div class="hero" role="img" aria-label="Атмосфера форума иллюзионистов"></div>
  <header class="intro"><h1>Международный форум иллюзионистов</h1><p>19–21 января 2027 · Санкт-Петербург</p></header>
  <main id="stage" class="stage" aria-label="Вариант главного блока"></main>
  <h2 class="section-title">Моё расписание</h2>
  <div class="saved" id="saved"><p>Сохранённые события появятся здесь.</p></div>
  <a class="back-link" href="../../index.html">Вернуться к действующей пробе</a>
</div>
<dialog class="detail" id="detail" aria-labelledby="detail-title"><small id="detail-time"></small><h2 id="detail-title"></h2><p id="detail-desc"></p><button id="detail-save" type="button"></button><button id="detail-close" type="button">Закрыть</button></dialog>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Анонс</button>
  <button class="proto-picker-item">Маршрут</button>
  <button class="proto-picker-item">Отсчёт</button>
</nav>
<script src="announcement.js"></script>
<script src="route.js"></script>
<script src="countdown.js"></script>
<script>
const schedule={a1:{title:'Регистрация участников',time:'19 января · 09:00',desc:'Первое событие в программе форума.'},a2:{title:'Открытие форума',time:'19 января · 10:00',desc:'Торжественное открытие IX Международного форума иллюзионистов.'}};
const saved=new Set();
const days=Math.max(0,Math.ceil((Date.parse('2027-01-19T09:00:00+03:00')-Date.now())/864e5));
const stage=document.getElementById('stage');
const detail=document.getElementById('detail');
const refreshSaved=()=>{document.getElementById('saved').innerHTML=saved.size?'<ul>'+[...saved].map(id=>'<li>'+schedule[id].time+' · '+schedule[id].title+'</li>').join('')+'</ul>':'<p>Сохранённые события появятся здесь.</p>'};
function openEvent(id){const e=schedule[id];if(!e)return;document.getElementById('detail-time').textContent=e.time;document.getElementById('detail-title').textContent=e.title;document.getElementById('detail-desc').textContent=e.desc;document.getElementById('detail-save').dataset.id=id;document.getElementById('detail-save').textContent=saved.has(id)?'Убрать из моего расписания':'Добавить в моё расписание';detail.showModal()}
stage.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b)return;const id=b.dataset.id;if(b.dataset.action==='open')openEvent(id);if(b.dataset.action==='save'){saved.has(id)?saved.delete(id):saved.add(id);mount(current);refreshSaved()}});
document.getElementById('detail-close').addEventListener('click',()=>detail.close());
document.getElementById('detail-save').addEventListener('click',event=>{const id=event.currentTarget.dataset.id;saved.has(id)?saved.delete(id):saved.add(id);detail.close();mount(current);refreshSaved()});
const variants=[()=>window.IFMVariantAnnouncement(days,saved),()=>window.IFMVariantRoute(days,saved),()=>window.IFMVariantCountdown(days,saved)];

// `variants` is an array of render functions, one per variant, in picker order.
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
